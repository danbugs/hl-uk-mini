# DNS servers for guest networking.
#
# The guest rootfs needs this file so glibc's resolver knows where to
# send DNS queries.  Without it, glibc defaults to nameserver 127.0.0.1,
# which has no DNS server on Windows hosts (and on many Linux hosts where
# systemd-resolved listens on 127.0.0.53 instead).
#
# All DNS queries go through hostsock to the host's real network stack,
# so these public resolvers must be reachable from the host.
nameserver 8.8.8.8
nameserver 1.1.1.1
