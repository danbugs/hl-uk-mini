# Windows-specific known failures — WHP on Hyperlight-Unikraft
#
# These modules pass on Linux (KVM guests have full outbound networking)
# but crash on Windows because WHP guests lack outbound networking —
# hostsock provides only inbound (listen) ports, not outbound TCP/HTTP.

[may-fix.whp-no-outbound-network]
reason = "WHP guests lack outbound networking — hostsock provides only inbound listen ports"
todo = "Implement outbound guest networking for WHP (requires Hyperlight changes)"
modules = [
    "test_codecmaps_cn",        # CRASH — downloads codec maps from unicode.org
    "test_codecmaps_jp",        # CRASH — downloads codec maps from unicode.org
    "test_codecmaps_kr",        # CRASH — downloads codec maps from unicode.org
    "test_codecmaps_tw",        # CRASH — downloads codec maps from unicode.org
    "test_telnetlib",           # CRASH — telnet client needs outbound TCP
    "test_urllib2net",          # CRASH — urllib2 network tests need outbound HTTP
    "test_urllibnet",           # CRASH — urllib network tests need outbound HTTP
]
