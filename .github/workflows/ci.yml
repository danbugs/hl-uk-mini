name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Lint ──────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  # ── Spell check ──────────────────────────────────────────────
  typos:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: crate-ci/typos@8a48f81b6c64dcfea44b3633223084c4be58ac5f # v1.49.0

  # ── Kernel verify ────────────────────────────────────────────
  kernel-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Verify kernel builds from source
        run: just verify-kernel

  # ── Build rootfs (shared) ────────────────────────────────────
  # Docker-based rootfs builds require Linux containers. This job
  # builds all CPIOs once and shares them to every test/bench/
  # conformance job via artifact.
  build-rootfs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Cache rootfs CPIOs
        id: rootfs-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build-elfloader
          key: rootfs-all-${{ hashFiles('drivers/**', 'examples/agent/custom/Dockerfile', 'conformance/python/**', 'examples/c/*.c', 'examples/c/*.cpp', 'examples/rust/*.rs', 'examples/go/*.go') }}

      - name: Install cpio
        if: steps.rootfs-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends cpio

      - name: Install .NET SDK
        if: steps.rootfs-cache.outputs.cache-hit != 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "9.0.x"

      - name: Install Go
        if: steps.rootfs-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
          cache: false

      - name: Build all rootfs images
        if: steps.rootfs-cache.outputs.cache-hit != 'true'
        run: just build-all-rootfs

      - name: Build conformance rootfs
        if: steps.rootfs-cache.outputs.cache-hit != 'true'
        run: just build-conformance python

      - name: Build test binaries
        if: steps.rootfs-cache.outputs.cache-hit != 'true'
        run: just build-test-bins

      - name: Upload rootfs CPIOs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rootfs-cpios
          path: build-elfloader/
          retention-days: 1

  # ── Test ──────────────────────────────────────────────────────
  test:
    name: "test (${{ matrix.platform }})"
    needs: build-rootfs
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Download rootfs CPIOs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rootfs-cpios
          path: build-elfloader/

      - name: Enable KVM
        if: runner.os == 'Linux'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: cargo test
        env:
          # Disable WHP surrogate processes on Windows — hluk uses
          # single-partition mode (WHvMapGpaRange).  Surrogates cause
          # the test binary to hang on exit because the lazy_static
          # SurrogateProcessManager is never dropped.
          HYPERLIGHT_MAX_SURROGATES: ${{ runner.os == 'Windows' && '0' || '' }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Single-partition mode allows only one WHP VM at a time,
            # so tests must run serially.  --no-fail-fast ensures all
            # test binaries run even if one has failures.
            cargo test --all-targets --locked --no-fail-fast -- --test-threads=1
          else
            cargo test --all-targets --locked
          fi

  # ── Conformance ──────────────────────────────────────────────
  conformance:
    name: "conformance (${{ matrix.platform }})"
    needs: build-rootfs
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Download rootfs CPIOs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rootfs-cpios
          path: build-elfloader/

      - name: Enable KVM
        if: runner.os == 'Linux'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Build hluk (release)
        env:
          HYPERLIGHT_MAX_SURROGATES: ${{ runner.os == 'Windows' && '0' || '' }}
        run: cargo build --release --locked

      - name: Run CPython conformance suite
        env:
          HYPERLIGHT_MAX_SURROGATES: ${{ runner.os == 'Windows' && '0' || '' }}
        run: |
          just conformance python 2>&1 | tee conformance-output.txt

      - name: Post conformance summary
        if: always()
        run: |
          if [ -f conformance-output.txt ]; then
            echo '## CPython Conformance Results (${{ matrix.platform }})' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            summary=$(grep '^SUMMARY ' conformance-output.txt || echo "no summary")
            echo "**${summary}**" >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            # List any non-PASS results
            fails=$(grep '^RESULT ' conformance-output.txt | grep -v 'status=PASS' || true)
            if [ -n "$fails" ]; then
              echo '### Non-passing modules' >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              echo "$fails" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

  # ── Benchmarks ───────────────────────────────────────────────
  bench:
    name: "bench (${{ matrix.platform }}, ${{ matrix.runtime }})"
    needs: build-rootfs
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write   # push to gh-pages
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        runtime: [python, agent-slim, agent]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Download rootfs CPIOs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rootfs-cpios
          path: build-elfloader/

      - name: Enable KVM
        if: runner.os == 'Linux'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Run benchmarks
        env:
          HYPERLIGHT_MAX_SURROGATES: ${{ runner.os == 'Windows' && '0' || '' }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Skip parallel bench — single-partition mode (no surrogates)
            # only allows one WHP VM per process.
            just bench ${{ matrix.runtime }} cold cold-snap warm-restore warm-stateful 2>&1 | tee bench-output.txt
          else
            just bench ${{ matrix.runtime }} 2>&1 | tee bench-output.txt
          fi

      - name: Post results to step summary
        if: always()
        run: |
          echo '## Benchmark Results — ${{ matrix.runtime }} (${{ matrix.platform }})' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # Extract the summary table (between the box footer and the JSON line)
          awk '/^╚.*╝/{f=1;next} f && /JSON:/{exit} f{print}' bench-output.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Store benchmark results
        if: github.event_name == 'push'
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: "${{ matrix.runtime }} benchmarks (${{ matrix.platform }})"
          tool: customSmallerIsBetter
          output-file-path: bench-results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          benchmark-data-dir-path: dev/bench/${{ matrix.platform }}/${{ matrix.runtime }}
          auto-push: true
          comment-on-alert: false

  # ── Gate ──────────────────────────────────────────────────────
  ci-passed:
    if: always()
    needs: [lint, typos, kernel-verify, test, conformance, bench]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Verify all jobs passed
        run: |
          jq --exit-status 'all(.result == "success")' \
            <<< '${{ toJson(needs) }}'
