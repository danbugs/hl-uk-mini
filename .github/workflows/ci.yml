name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Lint ──────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  # ── Spell check ──────────────────────────────────────────────
  typos:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: crate-ci/typos@8a48f81b6c64dcfea44b3633223084c4be58ac5f # v1.49.0

  # ── Kernel verify ────────────────────────────────────────────
  kernel-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Verify kernel builds from source
        run: just verify-kernel

  # ── Test ──────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Install cpio
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends cpio

      - name: Install .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "9.0.x"

      - name: Install Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.24"
          cache: false

      - name: Build all rootfs images
        run: |
          for runtime in python bash node dotnet-jit c rust go dotnet-aot agent-slim agent powershell; do
            echo "::group::build-rootfs $runtime"
            just build-rootfs "$runtime"
            echo "::endgroup::"
          done
          # agent-custom uses a custom Dockerfile
          echo "::group::build-rootfs agent-custom"
          just build-rootfs agent-custom examples/agent/custom/Dockerfile
          echo "::endgroup::"

      - name: cargo test
        run: cargo test --all-targets --locked

  # ── Conformance ──────────────────────────────────────────────
  conformance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Install cpio
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends cpio

      - name: Build conformance rootfs
        run: |
          just build-rootfs python
          just build-conformance python

      - name: Run CPython conformance suite
        run: |
          just conformance python 2>&1 | tee conformance-output.txt

      - name: Post conformance summary
        if: always()
        run: |
          if [ -f conformance-output.txt ]; then
            echo '## CPython Conformance Results' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            summary=$(grep '^SUMMARY ' conformance-output.txt || echo "no summary")
            echo "**${summary}**" >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            # List any non-PASS results
            fails=$(grep '^RESULT ' conformance-output.txt | grep -v 'status=PASS' || true)
            if [ -n "$fails" ]; then
              echo '### Non-passing modules' >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              echo "$fails" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

  # ── Benchmarks ───────────────────────────────────────────────
  bench:
    name: "bench (${{ matrix.runtime }}) — check results ↗"
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push to gh-pages
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runtime: [python, agent-slim, agent]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Install cpio
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends cpio

      - name: Build rootfs
        run: just build-rootfs ${{ matrix.runtime }}

      - name: Build hluk (release)
        run: cargo build --release --locked

      - name: Run benchmarks
        run: |
          just bench ${{ matrix.runtime }} 2>&1 | tee bench-output.txt

      - name: Post results to step summary
        if: always()
        run: |
          echo '## Benchmark Results — ${{ matrix.runtime }}' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # Extract the formatted table (starts after the header line, ends at JSON:)
          sed -n '/^  .*─/,/^  JSON:/p' bench-output.txt | head -n -1 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Benchmark results posted to the Summary tab of this workflow run"

      - name: Store benchmark results
        if: always()
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: ${{ matrix.runtime }} benchmarks
          tool: customSmallerIsBetter
          output-file-path: bench-results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          benchmark-data-dir-path: dev/bench/${{ matrix.runtime }}
          # Push to gh-pages only on main merges (not on PRs)
          auto-push: ${{ github.event_name == 'push' }}
          # Fail the job if a PR regresses perf by >15%
          fail-on-alert: ${{ github.event_name == 'pull_request' }}
          alert-threshold: '115%'
          comment-on-alert: false

  # ── Gate ──────────────────────────────────────────────────────
  ci-passed:
    if: always()
    needs: [lint, typos, kernel-verify, test, conformance, bench]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Verify all jobs passed
        run: |
          jq --exit-status 'all(.result == "success")' \
            <<< '${{ toJson(needs) }}'
