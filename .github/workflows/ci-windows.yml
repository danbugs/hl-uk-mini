name: CI (Windows)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Build rootfs on Linux ───────────────────────────────────────
  # Docker + cpio are not available on Windows runners, so we build
  # rootfs CPIOs on Linux and share them via workflow artifacts.
  build-rootfs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Cache rootfs CPIOs
        id: rootfs-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build-elfloader
          key: rootfs-win-all-${{ hashFiles('drivers/**', 'examples/agent/custom/Dockerfile', 'conformance/python/**') }}

      - name: Install cpio
        if: steps.rootfs-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends cpio

      - name: Install .NET SDK
        if: steps.rootfs-cache.outputs.cache-hit != 'true'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "9.0.x"

      - name: Install Go
        if: steps.rootfs-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.24"
          cache: false

      - name: Build all rootfs images
        if: steps.rootfs-cache.outputs.cache-hit != 'true'
        run: just build-all-rootfs

      - name: Build conformance rootfs
        if: steps.rootfs-cache.outputs.cache-hit != 'true'
        run: just build-conformance python

      - name: Upload rootfs artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rootfs-cpios
          path: build-elfloader/
          retention-days: 1

  # ── Windows tests ───────────────────────────────────────────────
  test:
    needs: build-rootfs
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Download rootfs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rootfs-cpios
          path: build-elfloader/

      - name: cargo test
        run: cargo test --all-targets --locked

  # ── Windows benchmarks ─────────────────────────────────────────
  bench:
    name: "bench (${{ matrix.runtime }}) [win]"
    needs: build-rootfs
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        runtime: [python, agent-slim, agent]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Download rootfs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rootfs-cpios
          path: build-elfloader/

      - name: Run benchmarks
        run: |
          just bench ${{ matrix.runtime }} 2>&1 | tee bench-output.txt

      - name: Post results to step summary
        if: always()
        run: |
          echo '## Benchmark Results — ${{ matrix.runtime }} (Windows)' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          awk '/^╚.*╝/{f=1;next} f && /JSON:/{exit} f{print}' bench-output.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Benchmark results posted to the Summary tab of this workflow run"

  # ── Windows conformance ─────────────────────────────────────────
  conformance:
    needs: build-rootfs
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Download rootfs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rootfs-cpios
          path: build-elfloader/

      - name: Run CPython conformance suite
        run: |
          just conformance python 2>&1 | tee conformance-output.txt

      - name: Post conformance summary
        if: always()
        run: |
          if [ -f conformance-output.txt ]; then
            echo '## CPython Conformance Results (Windows)' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            summary=$(grep '^SUMMARY ' conformance-output.txt || echo "no summary")
            echo "**${summary}**" >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            # List any non-PASS results
            fails=$(grep '^RESULT ' conformance-output.txt | grep -v 'status=PASS' || true)
            if [ -n "$fails" ]; then
              echo '### Non-passing modules' >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              echo "$fails" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

  # ── Gate ────────────────────────────────────────────────────────
  ci-windows-passed:
    if: always()
    needs: [test, conformance, bench]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Verify all jobs passed
        run: |
          jq --exit-status 'all(.result == "success")' \
            <<< '${{ toJson(needs) }}'
