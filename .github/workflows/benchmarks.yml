# Benchmark CI — runs on push to main and PRs, publishes to gh-pages.
#
# Uses github-action-benchmark to track trends and flag regressions.
# Mirrors the approach from hyperlight-unikraft (hl-uk).
#
# Prerequisites:
#   - KVM on the runner (GitHub ubuntu-latest supports nested virt)
#   - Docker for rootfs builds
#   - gh-pages branch (created automatically on first push)
name: Benchmarks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'benchmarks/**'
      - 'drivers/**'
      - '.github/workflows/benchmarks.yml'
  pull_request:
    branches: [main]

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: extractions/setup-just@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build rootfs + CLI + snapshot
        run: |
          just build-rootfs python
          just build
          just snapshot-save python

      - name: Run benchmarks
        run: just bench python

      - name: Publish results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Python Benchmarks
          tool: customSmallerIsBetter
          output-file-path: bench-results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          benchmark-data-dir-path: dev/bench/python
          auto-push: ${{ github.event_name == 'push' }}
          comment-always: ${{ github.event_name == 'pull_request' }}
          alert-threshold: '130%'
