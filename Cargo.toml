[package]
name = "hyperlight-unikraft"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "hluk"
path = "src/main.rs"

[features]
default = ["cli"]
cli = ["dep:clap", "dep:tracing-subscriber"]

[dependencies]
hyperlight-common = { git = "https://github.com/hyperlight-dev/hyperlight.git", branch = "hluk" }
hyperlight-host = { git = "https://github.com/hyperlight-dev/hyperlight.git", branch = "hluk" }
tracing = "0.1"

# Host I/O.  Filesystem: cap-std's `Dir` is the capability that keeps
# guest paths inside the mount on every host OS.  Networking: the guest
# speaks POSIX sockets one syscall per host call, and rustix is the safe,
# cross-platform (Linux, Windows) wrapper over exactly that API.
cap-std = "4"
rustix = { version = "1", features = ["net", "event"] }

# Optional — CLI only.
clap = { version = "4", features = ["derive"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
